<!DOCTYPE html>
<html>
<head>
    <title>Eye-Net Educational Academy - 360° Virtual Tour</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, viewport-fit=cover" />
    <meta name="description" content="360° Virtual Tour of Eye-Net Educational Academy Campus"/>
    <meta name="theme-color" content="#1e293b"/>
    <script src="lib/tdvplayer.js?v=1625125640410"></script>
    <script src="lib/Hls.js?v=1625125640410"></script>
    <script src="script.js?v=1625125640410"></script>
    <script type="text/javascript">
        var player;
        function loadTour() {
            if(player) return;
            var settings = new TDV.PlayerSettings();
            settings.set(TDV.PlayerSettings.CONTAINER, document.getElementById('viewer'));
            settings.set(TDV.PlayerSettings.SCRIPT_URL, 'script.js?v=1625125640410');
            settings.set(TDV.PlayerSettings.HLS_URL, 'lib/Hls.js?v=1625125640410');
            settings.set(TDV.PlayerSettings.QUERY_STRING_PARAMETERS, 'v=1625125640410');
            window.tdvplayer = player = TDV.PlayerAPI.create(settings);
            setTimeout(disposePreloader, 300);
            setTimeout(disposePreloader, 1000);
            setInterval(cleanOverlays, 250);
        }
        function cleanOverlays() {
            try {
                var v = document.getElementById('viewer');
                if (!v) return;
                var canvases = v.getElementsByTagName('canvas');
                for (var c = 0; c < canvases.length; c++) {
                    var cv = canvases[c];
                    if (cv.width === 0 || cv.clientWidth === 0) {
                        cv.width = window.innerWidth || 1920;
                        cv.height = window.innerHeight || 1080;
                    }
                    cv.style.width = '100vw';
                    cv.style.height = '100vh';
                    cv.style.position = 'absolute';
                    cv.style.top = '0px';
                    cv.style.left = '0px';
                }
                var divs = v.getElementsByTagName('div');
                for (var i = 0; i < divs.length; i++) {
                    var d = divs[i], s = d.getAttribute('style') || '';
                    if (s.indexOf('right:') !== -1 && s.indexOf('bottom:') !== -1) {
                        if (!d.querySelector('button') && !d.querySelector('a') && !d.querySelector('input') && !d.classList.contains('PlayList')) {
                            d.style.display = 'none';
                            d.style.opacity = '0';
                        }
                    }
                }
            } catch(e){}
        }
        function disposePreloader() {
            var p = document.getElementById('preloadContainer');
            if (p) {
                p.style.opacity = '0';
                p.style.pointerEvents = 'none';
                setTimeout(function(){ if(p && p.parentNode) p.parentNode.removeChild(p); }, 300);
            }
        }
    </script>
    <style type="text/css">
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
        #viewer { background: #000; z-index: 1; position: absolute; width: 100vw !important; height: 100vh !important; top: 0 !important; left: 0 !important; }
        #viewer canvas { width: 100vw !important; height: 100vh !important; position: absolute !important; top: 0 !important; left: 0 !important; object-fit: cover !important; }
        #preloadContainer { z-index: 9999; position: absolute; width: 100%; height: 100%; top: 0; left: 0; background: #fff; transition: opacity 0.3s; }
        #viewer div[style*="right"][style*="bottom"] { display: none !important; opacity: 0 !important; }
    </style>
</head>
<body onload="loadTour()">
    <div id="preloadContainer">
        <div style="z-index: 4; position: absolute; top: 45%; width: 100%; text-align: center; font-size: 16px; font-weight: 600; font-family: sans-serif; color: #334155;">
            Loading 360° Virtual Tour...
        </div>
    </div>
    <div id="viewer"></div>
</body>
</html>
