<!DOCTYPE html>
<html>
<head>
    <title>Eye-Net Educational Academy - 360° Virtual Tour</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, viewport-fit=cover" />
    <link rel="preload" href="script.js?v=1625125640410" as="script"/>
    <link rel="preload" href="media/panorama_527FFB31_58F5_D352_41CD_A55F73F06667_0/l/3/0_0.jpg?v=1625125640410" as="image"/>
    <meta name="description" content="360° Virtual Tour of Eye-Net Educational Academy Campus"/>
    <meta name="theme-color" content="#1e293b"/>
    <script src="lib/tdvplayer.js?v=1625125640410"></script>
    <script type="text/javascript">
        var player;
        var playersPlayingTmp = [];
        var isInitialized = false;
        var isPaused = false;

        function isSafariBrowser() {
            return /^((?!chrome|android|crios|ipad|iphone).)*safari/i.test(navigator.userAgent);
        }

        function loadTour()
        {
            if(player)
                return;

            var beginFunc = function(event){
                if(event.name == 'begin')
                {
                    var camera = event.data.source.get('camera');
                    if(camera && camera.get('initialSequence') && camera.get('initialSequence').get('movements').length > 0)
                        return;
                }

                if(event.sourceClassName == "MediaAudio")
                    return;

                isInitialized = true;

                player.unbind('preloadMediaShow', beginFunc, player, true);
                player.unbindOnObjectsOf('PanoramaPlayListItem', 'begin', beginFunc, player, true);
                player.unbind('stateChange', beginFunc, player, true);
                
                disposePreloader();
                onVirtualTourLoaded();
            };

            var settings = new TDV.PlayerSettings();
            
            settings.set(TDV.PlayerSettings.CONTAINER, document.getElementById('viewer'));
            settings.set(TDV.PlayerSettings.SCRIPT_URL, 'script.js?v=1625125640410');
            
            // Safari Fix: Avoid WebVR polyfill interference on Safari WebGL context
            if (!isSafariBrowser()) {
                settings.set(TDV.PlayerSettings.WEBVR_POLYFILL_URL, 'lib/WebVRPolyfill.js?v=1625125640410');
            }
            
            settings.set(TDV.PlayerSettings.HLS_URL, 'lib/Hls.js?v=1625125640410');
            settings.set(TDV.PlayerSettings.QUERY_STRING_PARAMETERS, 'v=1625125640410');
            window.tdvplayer = player = TDV.PlayerAPI.create(settings);
            player.bind('preloadMediaShow', beginFunc, player, true);
            player.bind('stateChange', beginFunc, player, true);
            player.bindOnObjectsOf('PanoramaPlayListItem', 'begin', beginFunc, player, true);
            player.bindOnObject('rootPlayer', 'start', function(e){
                var queryDict = {}; location.search.substr(1).split("&").forEach(function(item) {var k = item.split("=")[0], v = decodeURIComponent(item.split("=")[1]);queryDict[k] = v});
                var item = undefined;
                if("media-index" in queryDict){
                    item = setMediaByIndex(parseInt(queryDict["media-index"]) - 1);
                }
                else if("media-name" in queryDict){
                    item = setMediaByName(queryDict["media-name"]);
                }
                else{
                    item = setMediaByIndex(0);
                }
                if(item != undefined && "trigger-overlay-name" in queryDict){
                    triggerOverlayByName(item, queryDict["trigger-overlay-name"], "trigger-overlay-event" in queryDict ? queryDict["trigger-overlay-event"] : "click");
                }

                player.getById('rootPlayer').bind('tourEnded', function(){
                    onVirtualTourEnded();
                }, player, true);

                // Safari fallback: Force dismiss loading screen once player starts
                setTimeout(function() {
                    disposePreloader();
                }, 1500);
            }, player, false);

            /* Listen messages */
            window.addEventListener('message', function (e) {
                var action = e.data;
                if (action == 'pauseTour' || action == 'resumeTour') {
                    this[action].apply(this);
                }
            });
        }

        function pauseTour()
        {
            isPaused = true;
            if(!isInitialized)
                return;

            var playLists = player.getByClassName('PlayList');
            for(var i = 0; i< playLists.length; i++)
            {
                var playList = playLists[i];
                var media = playList.get('selectedMedia');
                if(media)
                {
                    media.pause();
                }
            }
        }

        function resumeTour()
        {
            isPaused = false;
            if(!isInitialized)
                return;

            var playLists = player.getByClassName('PlayList');
            for(var i = 0; i< playLists.length; i++)
            {
                var playList = playLists[i];
                var media = playList.get('selectedMedia');
                if(media)
                {
                    media.play();
                }
            }
        }

        function onVirtualTourLoaded()
        {
            disposePreloader();
        }

        function onVirtualTourEnded()
        {
        }

        function setMediaByIndex(index)
        {
            var rootPlayer = player.getById('rootPlayer');
            if(rootPlayer != undefined)
            {
                return rootPlayer.setMediaByIndex(index);
            }
        }

        function setMediaByName(name)
        {
            var rootPlayer = player.getById('rootPlayer');
            if(rootPlayer != undefined)
            {
                return rootPlayer.setMediaByName(name);
            }
        }

        function triggerOverlayByName(item, name, eventName)
        {
            var overlays = item.get('overlays');
            if(overlays)
            {
                for(var i = 0; i < overlays.length; i++)
                {
                    var overlay = overlays[i];
                    if(overlay.get('name') == name)
                    {
                        var event = overlay.get(eventName);
                        if(event)
                        {
                            event.execute();
                        }
                        break;
                    }
                }
            }
        }

        function disposePreloader()
        {
            var preloadContainer = document.getElementById('preloadContainer');
            if(preloadContainer)
            {
                preloadContainer.style.opacity = '0';
                setTimeout(function(){
                    if (preloadContainer.parentNode) {
                        preloadContainer.parentNode.removeChild(preloadContainer);
                    }
                }, 500);
            }
        }

        function showPreloader()
        {
            var preloadContainer = document.getElementById('preloadContainer');
            if(preloadContainer)
                preloadContainer.style.opacity = '1';
        }

        function onLoad()
        {
            showPreloader();
            loadTour();
        }
    </script>
    <style type="text/css">
        html, body { 
            width: 100%; 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden;
            background-color: #1e293b;
        }

        #viewer { 
            background-color: #1e293b; 
            z-index: 1; 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            top: 0; 
            left: 0; 
            right: 0;
            bottom: 0;
        }
        #preloadContainer { 
            z-index: 999; 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            top: 0;
            left: 0;
            background-color: #ffffff;
            transition: opacity 0.5s; 
            -webkit-transition: opacity 0.5s; 
        }
    </style>
</head>
<body onload="onLoad()">
    <div id="preloadContainer">
        <div style="z-index: 4; position: absolute; left: 0%; top: 45%; width: 100%; text-align: center;">
            <div style="font-size: 16px; font-weight: 600; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #334155;">
                Loading 360° Virtual Tour...
            </div>
        </div>
    </div>
    <div id="viewer"></div>
</body>
</html>
